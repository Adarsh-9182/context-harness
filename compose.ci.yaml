name: harness-container-ci
services:
  app:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:4323:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DEV_AUTH: "false"
      AUTH_TRUST_HOST: "true"
      APP_ORIGIN: https://harness-ci.invalid
      AUTH_URL: https://harness-ci.invalid
      DATABASE_URL: postgresql://harness:${POSTGRES_PASSWORD:?Generate the ephemeral CI environment first}@postgres:5432/harness
      REDIS_URL: redis://redis:6379
      HARNESS_MASTER_KEY: ${HARNESS_MASTER_KEY:?Generate the ephemeral CI environment first}
      AUTH_SECRET: ${AUTH_SECRET:?Generate the ephemeral CI environment first}
      # These are deliberately fake: CI lists the configured provider but never signs in.
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:?Generate the ephemeral CI environment first}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:?Generate the ephemeral CI environment first}
      HARNESS_E2E: "false"
      HARNESS_TEST_MODE: "false"
      ALLOW_LOCAL_MODELS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 20
    init: true
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate the ephemeral CI environment first}
      POSTGRES_DB: harness
    volumes:
      - ci-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  ci-postgres:
